name: Atualizar oportunidades FAPESP

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "index.html"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scraper/fetch_fapesp.py

      - name: Checar mudanças
        id: diff
        run: |
          if git diff --quiet -- data/oportunidades.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar dados atualizados
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oportunidades.json
          git commit -m "chore: atualizar oportunidades FAPESP"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
